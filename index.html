<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    
    <title>PIDE</title>
    <meta name="description" content="Pide taxi y comida desde tu celular" />
    
    <!-- PWA - Manifest dinámico según ruta -->
    <script>
      const esConductor = window.location.pathname.includes('/conductor');
      const manifest = esConductor ? '/manifest-conductor.json' : '/manifest.json';
      document.write('<link rel="manifest" href="' + manifest + '" />');
    </script>
    <meta name="theme-color" content="#7B2FBE" />
    <meta name="mobile-web-app-capable" content="yes" />
    
    <!-- iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PIDE" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    
    <!-- Icono -->
    <link rel="icon" type="image/png" href="/icons/icon-72.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
